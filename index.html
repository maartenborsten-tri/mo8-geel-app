<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MO8 Geel · BMHV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  .import-box{
    border:1.5px solid var(--blue);
    border-radius:12px;
    padding:12px 12px 4px;
    margin-bottom:22px;
    background:var(--cream);
  }
  .import-box textarea{
    width:100%;
    padding:9px 10px;
    border-radius:8px;
    border:1.5px solid var(--line);
    font-size:13px;
    font-family:'Karla',sans-serif;
    background:white;
    margin-bottom:8px;
  }
  .import-day{
    background:white;
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 10px 4px;
    margin-bottom:10px;
    font-size:13.5px;
  }
  .import-day-head{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:700;
    margin-bottom:4px;
  }
  .import-day-head input{width:16px; height:16px; flex:none;}
  .import-day .form-row{margin:8px 0;}
  .import-note{font-size:12px; color:var(--grey); margin:0 0 10px;}
  .import-warn{font-size:13px; color:var(--bordeaux); margin:0 0 10px;}
.game-block{
  border:1.5px dashed var(--line);
  border-radius:10px;
  padding:10px 10px 2px;
  margin-bottom:12px;
}
.game-block-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:6px;
  font-size:11.5px;
  text-transform:uppercase;
  letter-spacing:0.05em;
  color:var(--grey);
}
  
  :root{
    --blue:#1E3A6E;
    --blue-dark:#12274d;
    --bordeaux:#7C2D42;
    --yellow:#F4C430;
    --cream:#FBF7EC;
    --ink:#20201C;
    --line:#E6DCC3;
    --grey:#8b8577;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Karla',sans-serif;
    padding-bottom:60px;
  }
  .hero{
    background:var(--blue);
    background-image:linear-gradient(135deg,var(--blue) 0%,var(--blue-dark) 100%);
    color:white;
    padding:28px 20px 34px;
    position:relative;
    overflow:hidden;
  }
  .hero::after{
    content:"";
    position:absolute;
    right:-30px; top:-30px;
    width:140px; height:140px;
    border-radius:50%;
    background:var(--bordeaux);
    opacity:0.55;
  }
  .hero-inner{position:relative; z-index:1;}
  .crest-row{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .crest{
    width:46px; height:46px;
    border-radius:50%;
    background:white;
    padding:4px;
    object-fit:contain;
    flex:none;
    box-shadow:0 2px 6px rgba(0,0,0,0.25);
  }
  .stick-icon{
    width:22px; height:22px;
    vertical-align:middle;
    margin-left:4px;
    position:relative;
    top:-2px;
  }
  .cuff{
    position:absolute;
    left:0; right:0; bottom:0;
    display:flex;
    flex-direction:column;
    z-index:1;
  }
  .cuff .piping{height:2px; background:rgba(255,255,255,0.85);}
  .cuff .bordeaux-band{height:7px; background:var(--bordeaux);}
  .cuff .yellow-band{height:5px; background:var(--yellow);}
  .eyebrow{
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:0.14em;
    font-size:12px;
    color:var(--yellow);
    margin:0 0 4px;
  }
  h1{
    font-family:'Oswald',sans-serif;
    font-size:30px;
    margin:0;
    letter-spacing:0.01em;
  }
  .sub{
    margin:6px 0 0;
    font-size:14px;
    color:#d9e0ee;
  }
  .wrap{max-width:640px; margin:0 auto; padding:0 16px;}
  .whoami{
    background:white;
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 16px;
    margin:-18px 0 18px;
    position:relative;
    z-index:2;
    box-shadow:0 4px 14px rgba(30,58,110,0.10);
  }
  .whoami label{
    font-family:'Oswald',sans-serif;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--blue);
    display:block;
    margin-bottom:6px;
  }
  select{
    width:100%;
    padding:10px 12px;
    border-radius:9px;
    border:1.5px solid var(--line);
    background:var(--cream);
    font-family:'Karla',sans-serif;
    font-size:15px;
    color:var(--ink);
  }
  .section-title{
    font-family:'Oswald',sans-serif;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:0.12em;
    color:var(--grey);
    margin:22px 2px 10px;
  }
  .section-title.played-title{
    margin-top:34px;
    padding-top:18px;
    border-top:1px dashed var(--line);
  }
  .match-card{
    background:white;
    border-radius:16px;
    border:1px solid var(--line);
    margin-bottom:16px;
    overflow:hidden;
    box-shadow:0 3px 10px rgba(30,58,110,0.06);
  }
  .match-card.next{
    border-color:var(--yellow);
    box-shadow:0 4px 16px rgba(244,196,48,0.35);
  }
  .match-top{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 16px;
    cursor:pointer;
    background:linear-gradient(90deg, rgba(30,58,110,0.04), transparent);
  }
  .date-badge{
    flex:none;
    width:52px; height:52px;
    border-radius:10px;
    background:var(--blue);
    color:white;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    font-family:'Oswald',sans-serif;
    line-height:1;
  }
  .date-badge .d{font-size:19px; font-weight:700;}
  .date-badge .m{font-size:10px; text-transform:uppercase; letter-spacing:0.05em; margin-top:2px;}
  .match-info{flex:1; min-width:0;}
  .match-info .opp{
    font-family:'Oswald',sans-serif;
    font-size:16px;
    font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .match-info .meta{
    font-size:12.5px;
    color:var(--grey);
    margin-top:2px;
  }
  .tag{
    flex:none;
    font-family:'Oswald',sans-serif;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    padding:4px 9px;
    border-radius:999px;
  }
  .tag.thuis{background:#e7f0e4; color:#3c6b34;}
  .tag.uit{background:#f6e6e9; color:var(--bordeaux);}
  .tag.veld{background:#e7edf6; color:var(--blue);}
  .tag.result-win{background:#e7f0e4; color:#3c6b34; font-weight:700;}
  .tag.result-loss{background:#f6e6e9; color:var(--bordeaux); font-weight:700;}
  .tag.result-draw{background:#eee9dd; color:var(--grey); font-weight:700;}
  .chev{flex:none; color:var(--grey); font-size:13px; transition:transform 0.15s;}
  .match-card.open .chev{transform:rotate(180deg);}
  .next-flag{
    background:var(--yellow);
    color:var(--blue-dark);
    font-family:'Oswald',sans-serif;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    padding:3px 16px;
    font-weight:700;
  }
  .match-body{
    display:none;
    border-top:1px dashed var(--line);
    padding:14px 16px 16px;
  }
  .match-card.open .match-body{display:block;}
  .player-row{
    display:flex;
    flex-direction:column;
    gap:7px;
    padding:10px 0;
    border-bottom:1px solid #f1ede0;
  }
  .player-row:last-of-type{border-bottom:none;}
  .player-name{
    font-size:14.5px;
    font-weight:600;
  }
  .player-controls{
    display:flex;
    flex-wrap:wrap;
    gap:14px 20px;
  }
  .control-group{
    display:flex;
    align-items:center;
    gap:8px;
    flex:none;
  }
  .pillgroup{display:flex; gap:5px; flex:none;}
  .pill{
    font-family:'Karla',sans-serif;
    font-size:12.5px;
    font-weight:700;
    padding:6px 11px;
    border-radius:8px;

    background:var(--cream);
    color:var(--grey);
    cursor:pointer;
    user-select:none;
  }
  .pill.ja.active{background:#3c6b34; border-color:#3c6b34; color:white;}
  .pill.nee.active{background:var(--bordeaux); border-color:var(--bordeaux); color:white;}
  .field-label{
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--grey);
    flex:none;
  }
  .subhead{
    font-family:'Oswald',sans-serif;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--blue);

  .fruit-chips{display:flex; flex-wrap:wrap; gap:7px;}
  .fruit-chip{
    padding:7px 12px;
    border-radius:999px;
    border:1.5px solid var(--line);
    background:var(--cream);
    font-size:13px;
    cursor:pointer;
  }
  .fruit-chip.active{background:var(--yellow); border-color:var(--yellow); color:var(--blue-dark); font-weight:700;}
  .driver-chip.active{background:var(--blue); border-color:var(--blue); color:white;}
  .driver-count{
    display:inline-block;
    font-family:'Karla',sans-serif;
    font-size:11px;
    font-weight:700;
    padding:2px 8px;
    border-radius:999px;
    margin-left:6px;
    vertical-align:middle;
  }
  .driver-count.ok{background:#e7f0e4; color:#3c6b34;}
  .driver-count.warn{background:#f6e6e9; color:var(--bordeaux);}
  .announce-box{
    margin-top:20px;
    background:var(--cream);
    border:2px solid var(--blue);
    border-radius:12px;
    padding:14px 16px 16px;
  }
  .announce-title{
    font-family:'Oswald',sans-serif;
    font-size:14px;
    font-weight:700;
    color:var(--blue-dark);
    margin-bottom:10px;
  }
  .announce-row{
    font-size:13.5px;
    line-height:1.5;
    margin-bottom:7px;
  }
  .announce-row:last-child{margin-bottom:0;}
  .announce-row.warn{
    color:var(--bordeaux);
    font-weight:700;
  }
  .empty{
    text-align:center;
    color:var(--grey);
    padding:34px 20px;
    font-size:14.5px;
    background:white;
    border-radius:14px;
    border:1px dashed var(--line);
  }
  .admin-toggle{
    text-align:center;
    margin:26px 0 10px;
  }
  .link-btn{
    background:none;
    border:none;
    color:var(--blue);
    font-family:'Oswald',sans-serif;
    font-size:12.5px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    cursor:pointer;
    text-decoration:underline;
    padding:8px;
  }
  .admin-panel{
    background:white;
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px;
    margin-bottom:20px;
  }
  .admin-panel h3{
    font-family:'Oswald',sans-serif;
    font-size:15px;
    margin:0 0 12px;
  }
  .form-row{margin-bottom:10px;}
  .form-row label{
    display:block;
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--grey);
    margin-bottom:4px;
  }
  .form-row input, .form-row select{
    width:100%;
    padding:9px 10px;
    border-radius:8px;
    border:1.5px solid var(--line);
    font-size:14.5px;
    font-family:'Karla',sans-serif;
    background:var(--cream);
  }
  .btn-primary{
    background:var(--blue);
    color:white;
    border:none;
    padding:11px 18px;
    border-radius:9px;
    font-family:'Oswald',sans-serif;
    font-size:13.5px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    cursor:pointer;
    width:100%;
  }
  .existing-match{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 0 4px;
    font-size:13.5px;
  }
  .existing-match .em-info{flex:1;}
  .existing-match-flags{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:7px;
    padding:0 0 10px;
    border-bottom:1px solid #f1ede0;
  }
  .flag-toggle{
    font-size:11.5px;
    padding:5px 10px;
    border-radius:7px;
    border:1.5px solid var(--line);
    background:var(--cream);
    color:var(--grey);
    cursor:pointer;
  }
  .flag-toggle.active{background:var(--blue); border-color:var(--blue); color:white; font-weight:700;}
  .checkbox-row label{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13.5px;
    text-transform:none;
    letter-spacing:normal;
    color:var(--ink);
    cursor:pointer;
  }
  .checkbox-row input[type="checkbox"]{
    width:16px; height:16px;
    flex:none;
  }
  .edit-btn{
    background:none;
    border:1.5px solid var(--blue);
    color:var(--blue);
    border-radius:7px;
    font-size:12px;
    padding:5px 9px;
    cursor:pointer;
    flex:none;
  }
  .del-btn{
    background:none;
    border:1.5px solid var(--bordeaux);
    color:var(--bordeaux);
    border-radius:7px;
    font-size:12px;
    padding:5px 9px;
    cursor:pointer;
    flex:none;
  }
  .existing-match.editing .em-info{
    color:var(--blue);
    font-weight:700;
  }
  .loading{
    text-align:center;
    padding:50px 20px;
    color:var(--grey);
    font-size:14px;
  }
  .toast{
    position:fixed;
    bottom:18px; left:50%;
    transform:translateX(-50%);
    background:var(--blue-dark);
    color:white;
    padding:9px 18px;
    border-radius:999px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.2s;
    z-index:99;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>

  
  
<div class="hero">
  <div class="hero-inner wrap" style="padding:0;">
    <div class="crest-row">
      <img class="crest" src="https://irp.cdn-website.com/a80a5bef/dms3rep/multi/opt/bmhv_logo_shape-1920w.png" alt="BMHV" onerror="this.style.display='none'">
      <div>
        <p class="eyebrow">BMHV · Baarn</p>
        <h1>MO8 Geel <svg class="stick-icon" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="30" cy="30" r="6" fill="var(--yellow)"/>
          <path d="M8 4 L16 26 Q18 32 24 30" stroke="white" stroke-width="3.2" fill="none" stroke-linecap="round"/>
        </svg></h1>
      </div>
    </div>
    <p class="sub">Aanwezigheid, rijden & fruit per wedstrijd</p>
  </div>
  <div class="cuff">
    <div class="piping"></div>

    <div class="yellow-band"></div>
  </div>
</div>

<div class="wrap">
  <div class="whoami">
    <label for="whoSelect">Wie ben jij?</label>
    <select id="whoSelect" onchange="onWhoChange()">
      <option value="">Kies je dochter…</option>
    </select>
  </div>

  <div id="content">
    <div class="loading">Bezig met laden…</div>
  </div>

  <div class="admin-toggle">
    <button class="link-btn" onclick="toggleAdmin()">Wedstrijden beheren</button>
  </div>

  <div id="adminPanel" class="admin-panel" style="display:none;"></div>
</div>

<div id="toast" class="toast"></div>
<script>
const PLAYERS = ["Caroline","Amber","Kiki","Charlotte","Sophia","Fiep","Jolie","Jasmijn"];
const OWN_TEAM = "Baarn MO8-Geel";
const MAANDEN = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];

let matches = [];
let responses = {};
let weatherData = {};
let travelData = {};
let openMatchId = null;
let adminOpen = false;
let editingMatchId = null;

// Een "wedstrijd" kan uit meerdere achter-elkaar gespeelde partijen bestaan
// (vooral bij zaalhockey, waar een team tijdens één speelronde meerdere
// tegenstanders na elkaar treft). Daarom staat elke wedstrijd intern altijd
// als { date, location, address, indoor, witShirt, games:[...] }, met één
// entry in 'games' per tegenstander/tijdstip — maar met maar 1 keer
// beschikbaarheid/fruit/chauffeurs voor de hele speeldag.
function blankGame(){
  return { time:'', opponent:'', veld:'', ownScore:'', oppScore:'' };
}

// Zet een wedstrijd die nog in de oude vorm staat (1 vast opponent/time/veld/
// score-veld per match) om naar de nieuwe 'games'-opzet. Wedstrijden die al
// in de nieuwe vorm staan, blijven ongewijzigd. Dit maakt oude, al
// opgeslagen wedstrijden (en de SEED_MATCHES hieronder) automatisch
// compatibel zonder dat er iets hoeft te migreren op het Sheet zelf.
function migrateToGames_(m){
  if(!Array.isArray(m.games)){
    m.games = [{
      time: m.time || '',
      opponent: m.opponent || '',
      veld: m.veld || '',
      ownScore: typeof m.ownScore === 'string' ? m.ownScore : '',
      oppScore: typeof m.oppScore === 'string' ? m.oppScore : ''
    }];
  }
  delete m.time;
  delete m.opponent;
  delete m.ownScore;
  delete m.oppScore;
  delete m.veld;
  m.games.forEach(g=>{
    if(typeof g.time !== 'string') g.time = '';
    if(typeof g.opponent !== 'string') g.opponent = '';
    if(typeof g.veld !== 'string') g.veld = '';
    if(typeof g.ownScore !== 'string') g.ownScore = '';
    if(typeof g.oppScore !== 'string') g.oppScore = '';
  });
  if(typeof m.witShirt !== 'boolean') m.witShirt = true;
  if(typeof m.indoor !== 'boolean') m.indoor = false;
  if(typeof m.address !== 'string') m.address = '';
  return m;
}

function gameTimeVeldLabel(g){
  const timePart = g.time ? g.time+'u' : 'tijd n.b.';
  const veldPart = g.veld ? ' · veld '+g.veld : '';
  return timePart + veldPart;
}

function opponentsTitle(match){
  return match.games.map(g=>g.opponent).join(' & ');
}

// Formulierstatus voor het toevoegen/bewerken van een wedstrijd in het
// beheerpaneel. formGames is een array zodat je meerdere tegenstanders
// (achter elkaar gespeeld op dezelfde dag) in één keer kunt invoeren.
let formGames = [blankGame()];
let formBasic = { date:'', location:'thuis', address:'', witShirt:true, indoor:false };

function resetForm(){
  formBasic = { date:'', location:'thuis', address:'', witShirt:true, indoor:false };
  formGames = [blankGame()];
}

// ── Programma importeren (plakken vanaf hockeystanden.nl) ──────────────────
// hockeystanden.nl blokkeert automatisch ophalen (Cloudflare), dus de
// automatische check in Apps Script kan er niet meer bij. In plaats daarvan
// kopieer je in je eigen browser het programma van de teampagina en plak je
// dat in het beheerpaneel; hieronder wordt de tekst omgezet naar speeldagen.
const OWN_TEAM_RE = /Baarn\s+z?MO8[-\s]?Geel/i;
const HOME_VELD_ADDRESS = "Sportpark 'Ter Eem' (Baarn), De Geerenweg 10, Baarn";
const MON_ABBR = {jan:0,feb:1,mrt:2,apr:3,mei:4,jun:5,jul:6,aug:7,sep:8,okt:9,nov:10,dec:11};
const MON_FULL = {januari:0,februari:1,maart:2,april:3,mei:4,juni:5,juli:6,augustus:7,september:8,oktober:9,november:10,december:11};
const DATE_LINE_RE = /^(?:ma|di|wo|do|vr|za|zo)[a-z]*\.?,?\s+(\d{1,2})\s+(jan|feb|mrt|apr|mei|jun|jul|aug|sep|okt|nov|dec)[a-z]*\.?/i;
const HEADER_RE = /^(januari|februari|maart|april|mei|juni|juli|augustus|september|oktober|november|december)(?:\s+(\d{4}))?$/i;

let importText = '';
let importDays = [];
let importInfo = null;

function pad2_(n){ return String(n).padStart(2,'0'); }
function escHtml_(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function byTime_(a,b){ return (a.time||'').localeCompare(b.time||''); }

// Zet geplakte tekst van de hockeystanden.nl-teampagina om naar speeldagen.
// Werkt op de volgorde in de tekst: een regel met een datum ("zo 6 dec")
// start een wedstrijd; alles tot de volgende datum hoort erbij (tijd,
// teamnamen, veld). Al gespeelde wedstrijden (met uitslag) en datums in het
// verleden worden overgeslagen.
function parseProgramma_(text, todayStr){
  const today = todayStr || todayISO();
  const lines = String(text || '').split(/\r?\n/).map(s=>s.replace(/\t+/g,' ').trim()).filter(Boolean);
  let year = parseInt(today.slice(0,4), 10);
  let lastMonth = -1;
  const segs = [];
  let cur = null;

  lines.forEach(line=>{
    const h = line.match(HEADER_RE);
    if(h){
      const mo = MON_FULL[h[1].toLowerCase()];
      if(h[2]) year = parseInt(h[2], 10);
      else if(mo < lastMonth) year++;
      lastMonth = mo;
      cur = null;
      return;
    }
    const d = line.match(DATE_LINE_RE);
    if(d){
      const mo = MON_ABBR[d[2].toLowerCase()];
      if(mo < lastMonth) year++;
      lastMonth = mo;
      cur = { date: year + '-' + pad2_(mo+1) + '-' + pad2_(parseInt(d[1],10)), text: line.slice(d[0].length) };
      segs.push(cur);
      return;
    }
    if(cur) cur.text += ' ' + line;
  });

  const info = { skippedPlayed:0, skippedPast:0, unrecognized:0, segments: segs.length };
  const found = [];
  const isBadge = t=>/^[A-Z]{2,3}$/.test(t);
  const isCat = t=>/^z?[MJ][OJA]?\d{1,2}/i.test(t);

  segs.forEach(seg=>{
    let s = ' ' + seg.text.replace(/\s+/g,' ') + ' ';

    // Veld/baan en (bij zaal) de naam van de hal, bijv. "1. BLR-Bimon veld" of "Veld 2".
    let veld = '', venue = '';
    let vm = s.match(/(\d+)\.\s*([A-Za-z0-9][A-Za-z0-9 .'&\/-]*?)\s+veld\b/i);
    if(vm){ veld = vm[1]; venue = vm[2].trim(); s = s.replace(vm[0], ' '); }
    else{
      vm = s.match(/\bveld\s*(\d+)\b/i);
      if(vm){ veld = vm[1]; s = s.replace(vm[0], ' '); }
    }

    let time = '';
    const tm = s.match(/(?:^|\s)(\d{1,2}):(\d{2})(?=\s|$)/);
    if(tm){
      time = pad2_(parseInt(tm[1],10)) + ':' + tm[2];
      s = s.replace(tm[0], ' ');
      if(time === '00:00') time = '';
    }
    const sm = s.match(/(?:^|\s)(\d{1,2})\s*[-–]\s*(\d{1,2})(?=\s|$)/);
    if(!tm && sm){ info.skippedPlayed++; return; }
    if(seg.date < today){ info.skippedPast++; return; }

    s = s.replace(/\s+/g,' ').trim();
    const om = s.match(OWN_TEAM_RE);
    if(!om){ info.unrecognized++; return; }
    const indoor = /Baarn\s+zMO8/i.test(om[0]);
    let b = s.slice(0, om.index).trim().split(' ').filter(Boolean);
    let a = s.slice(om.index + om[0].length).trim().split(' ').filter(Boolean);

    // Eigen clubafkorting ("BA") naast de eigen teamnaam weghalen.
    if(b.length && b[b.length-1] === 'BA') b.pop();
    else if(a.length && a[0] === 'BA') a.shift();

    let opponentTokens, location;
    if(b.length){
            location = 'uit';   // eigen team staat rechts: tegenstander is thuisploeg
      if(b.length >= 2 && isBadge(b[0]) && !isCat(b[1])) b.shift();   // afkorting vóór de naam ("WO Woerden …")
      if(b.length >= 2 && isBadge(b[b.length-1])) b.pop();            // afkorting ná de naam ("Woerden … WO")
      opponentTokens = b;
    }else{
      location = 'thuis';
      if(a.length >= 2 && isBadge(a[0]) && !isCat(a[1])) a.shift();
      opponentTokens = a;
    }
    const catIdx = opponentTokens.findIndex(isCat);
    if(catIdx !== -1) opponentTokens = opponentTokens.slice(0, catIdx + 1);
    const opponent = opponentTokens.join(' ').trim();
    if(!opponent){ info.unrecognized++; return; }

    found.push({ date: seg.date, indoor: indoor, location: location, venue: venue,
      game: { time: time, opponent: opponent, veld: veld, ownScore: '', oppScore: '' } });
  });

  // Groeperen per speeldag (datum + zaal/veld), net als de oude automatische check.
  const map = {};
  const order = [];
  found.forEach(f=>{
    const k = f.date + '|' + (f.indoor ? 1 : 0);
    if(!map[k]){
      map[k] = { date: f.date, indoor: f.indoor, location: f.location, venue: f.venue, games: [] };
      order.push(k);
    }
    const day = map[k];
    if(!day.venue && f.venue) day.venue = f.venue;
    if(!day.games.some(g=>g.opponent === f.game.opponent)) day.games.push(f.game);
  });
  const days = order.map(k=>{
    const d = map[k];
    d.games.sort(byTime_);
    d.address = (d.location === 'thuis' && !d.indoor) ? HOME_VELD_ADDRESS : d.venue;
    return d;
  }).sort((x,y)=> x.date.localeCompare(y.date));

  return { days: days, info: info };
}

function readImportFromDom(){
  const t = document.getElementById('imp-text');
  if(t) importText = t.value;
  importDays.forEach((d,i)=>{

    if(a) d.address = a.value;

function parseImport(){
  readImportFromDom();
  const res = parseProgramma_(importText);
  importDays = res.days.map(d=>Object.assign({ selected:true }, d));
  importInfo = res.info;
  renderAdmin();
}

function clearImport(){
  importText = '';
  importDays = [];
  importInfo = null;
  renderAdmin();
}

async function runImport(){
  readImportFromDom();
  const chosen = importDays.filter(d=>d.selected);
  if(!chosen.length){ showToast('Niets geselecteerd'); return; }
  let added = 0, updated = 0, failed = false;
  for(let i = 0; i < chosen.length; i++){
    const day = chosen[i];
    const existing = matches.find(m=>m.date === day.date && !!m.indoor === !!day.indoor);
    try{
      if(existing){
        let changed = false;
        day.games.forEach(g=>{
          const eg = existing.games.find(x=>x.opponent === g.opponent);
          if(!eg){ existing.games.push(Object.assign({}, g)); changed = true; }
          else{
            if(g.time && eg.time !== g.time){ eg.time = g.time; changed = true; }
            if(g.veld && eg.veld !== g.veld){ eg.veld = g.veld; changed = true; }
          }
        });
        if(!existing.address && day.address){ existing.address = day.address; changed = true; }
        if(changed){
          existing.games.sort(byTime_);
          await saveMatch(existing.id);
          updated++;
        }
      }else{
        const id = 'm' + Date.now() + '-' + i;
        matches.push({
          id: id, date: day.date, location: day.location, address: day.address || '',
          witShirt: true, indoor: !!day.indoor,
          games: day.games.map(g=>Object.assign({}, g))
        });
        responses[id] = defaultResp();
        await saveMatch(id);
        await saveResp(id);
        added++;
      }
    }catch(e){ failed = true; }
  }
  importText = '';
  importDays = [];
  importInfo = null;
  showToast(failed ? 'Importeren deels mislukt, controleer de lijst' : 'Geïmporteerd: ' + added + ' nieuw, ' + updated + ' bijgewerkt');
  render();
}

function todayISO(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}

function subtractMinutes(timeStr, mins){
  const [h, m] = timeStr.split(':').map(Number);
  let total = h * 60 + m - mins;
  if (total < 0) total += 24 * 60;
  const hh = Math.floor(total / 60).toString().padStart(2, '0');
  const mm = (total % 60).toString().padStart(2, '0');
  return hh + ':' + mm;
}

// Rondt een aantal minuten naar boven af op een kwartier, zodat de

// van bijv. "08:07 uur" door een reistijd-schatting op de minuut nauwkeurig.
function roundUpToQuarter(mins){
  return Math.ceil(mins / 15) * 15;
}

// Vul hieronder de URL in die je krijgt na het implementeren van de
// Apps Script (zie instructies die je apart hebt gekregen). Zonder deze URL
// kan de app niet opslaan.
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxKjzB3_WgypCvqclbTEE6G221mXFSLWEhk6X2GjFeZDqPo5lkm9-d5FiIC0HkpCcfaAA/exec';

async function apiGet(key){
  const res = await fetch(SCRIPT_URL + '?key=' + encodeURIComponent(key));
  if(!res.ok) throw new Error('Netwerkfout bij ophalen');
  const data = await res.json();
  if(data && data.error) throw new Error(data.error);
  return (data && data.value) ? data.value : null;
}

// Haalt in ÉÉN verzoek alle opgeslagen cellen op (match:<id>, resp:<id>,
// weather:<id>, en eventuele oudere sleutels voor de migratie). Dit houdt
// een normale laadbeurt op 1 netwerkverzoek, ook nu elke wedstrijd en elk
// antwoord in zijn eigen cel staat.
async function apiGetAll(){
  // Cache-breker: voorkomt dat de browser een oude versie van de data hergebruikt.
  const res = await fetch(SCRIPT_URL + '?all=1&_=' + Date.now(), { cache: 'no-store' });
  if(!res.ok) throw new Error('Netwerkfout bij ophalen');
  const data = await res.json();
  if(data && data.error) throw new Error(data.error);
  return (data && data.data) ? data.data : {};
}

async function apiSet(key, value){
  try{
    await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:'set', key, value })
    });
  }catch(e){
    throw new Error('Netwerkfout bij opslaan');
  }
}

async function apiDelete(key){
  try{
    await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:'delete', key })
    });
  }catch(e){
    throw new Error('Netwerkfout bij verwijderen');
  }
}

async function loadAll(){
  let raw;
  try{
    raw = await apiGetAll();
  }catch(e){
    // Belangrijk: bij een mislukte ophaalpoging NOOIT aannemen dat de Sheet
    // leeg is en NOOIT iets terugschrijven — dat overschreef eerder per
    // ongeluk al juist ingevulde tijden/adressen/antwoorden bij een
    // tijdelijke hik. We tonen een foutmelding en stoppen.
    document.getElementById('content').innerHTML =
      '<div class="empty">Kon de wedstrijden niet ophalen (tijdelijk netwerkprobleem).<br>Ververs de pagina om het opnieuw te proberen — er is niets gewijzigd.<br><small>' + escHtml_(e && e.message ? e.message : e) + '</small></div>';
    return;
  }

  // Nieuwe opzet: elke wedstrijd staat in zijn eigen cel ('match:<id>') en
  // elk antwoord in zijn eigen cel ('resp:<id>'). Daardoor raakt een save
  // van de automatische hockeystanden-check, of van één ouder die een
  // vakje aanklikt, nooit meer de data van iets anders aan — er is geen
  // groot "alles"-object meer dat in zijn geheel overschreven kan worden.
  matches = [];
  responses = {};
  weatherData = {};
  travelData = {};
  let hasNewScheme = false;

  Object.keys(raw).forEach(function(k){
    if(k.indexOf('match:') === 0){
      hasNewScheme = true;
      try{
        const m = JSON.parse(raw[k]);
        m.id = k.slice(6);
        matches.push(m);
      }catch(e){ /* corrupte cel overslaan */ }
    }
  });
  Object.keys(raw).forEach(function(k){
    if(k.indexOf('resp:') === 0){
      const id = k.slice(5);
      try{ responses[id] = JSON.parse(raw[k]); }catch(e){ responses[id] = defaultResp(); }
    }
    if(k.indexOf('weather:') === 0){
      const id = k.slice(8);
      try{ weatherData[id] = JSON.parse(raw[k]); }catch(e){ /* negeren */ }
    }
    if(k.indexOf('travel:') === 0){
      const id = k.slice(7);
      try{ travelData[id] = JSON.parse(raw[k]); }catch(e){ /* negeren */ }
    }
  });

  if(!hasNewScheme){
    // Eenmalige migratie vanuit een oudere opzet: eerst proberen vanuit het
    // samengevoegde 'appdata'-blok, anders vanuit de nog oudere losse
    // 'matches'-sleutel. De 'resp:<id>'-cellen heetten in beide eerdere
    // opzetten al precies zo, dus die zijn hierboven al gewoon meegelezen.
    let legacyMatches = null;
    if(raw['appdata']){
      try{
        const legacy = JSON.parse(raw['appdata']);
        legacyMatches = legacy.matches || null;
        const legacyResp = legacy.responses || {};
        Object.keys(legacyResp).forEach(id=>{ if(!responses[id]) responses[id] = legacyResp[id]; });
      }catch(e){ /* negeren, volgende terugval proberen */ }
    }
    if(!legacyMatches && raw['matches']){
      try{ legacyMatches = JSON.parse(raw['matches']); }catch(e){ /* negeren */ }
    }
    if(!legacyMatches){
      legacyMatches = SEED_MATCHES.map(m=>({...m}));
    }
    matches = legacyMatches;

    // Schrijf elke wedstrijd nu eenmalig weg als eigen match:<id>-cel, zodat
    // de volgende laadbeurt meteen de nieuwe, granulaire opzet gebruikt.
    for (const m of matches) {
      const { id, ...rest } = m;
      try{ await apiSet('match:'+id, JSON.stringify(rest)); }catch(e){ /* probeert het gewoon nog een keer bij de volgende load */ }
    }
  }

  matches.forEach(migrateToGames_);
  matches.forEach(m=>{
    if(!responses[m.id]) responses[m.id] = defaultResp();
    if(!responses[m.id].chauffeurs) responses[m.id].chauffeurs = [];
    if(!responses[m.id].begeleiders) responses[m.id].begeleiders = [];
  });

  populateWhoSelect();
  render();
}

// de antwoorden-cel van deze of een andere wedstrijd aan.
async function saveMatch(matchId){

// Slaat uitsluitend de antwoorden van déze ene wedstrijd op — raakt nooit
// de wedstrijdgegevens of de antwoorden van een andere wedstrijd aan.

function fmtDate(iso){
  const d = new Date(iso+'T00:00:00');
  return { d: d.getDate(), m: MAANDEN[d.getMonth()] };
}

function fmtDateLong(iso){
  const d = new Date(iso+'T00:00:00');
  const dagen = ["zondag","maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag"];
  return dagen[d.getDay()] + ' ' + d.getDate() + ' ' + MAANDEN[d.getMonth()];
}

// Sorteert op datum, en bij gelijke datum op de tijd van de eerste
// wedstrijd van die speeldag (match.games is altijd al op tijd gesorteerd).
function sortKey(m){
  return m.date + (m.games[0] ? m.games[0].time : '');
}

function sortedMatches(){
  return [...matches].sort((a,b)=> sortKey(a).localeCompare(sortKey(b)));
}

// Voor de weergave aan ouders: aankomende wedstrijden altijd bovenaan
// (dichtstbijzijnde eerst), gespeelde wedstrijden onderaan (meest recente
// eerst binnen die groep). sortedMatches() blijft puur chronologisch en
// wordt nog gebruikt voor het beheerpaneel en het bepalen van de eerstvolgende.
function displayMatches(){
  const today = todayISO();
  const upcoming = matches.filter(m=>m.date >= today)
    .sort((a,b)=> sortKey(a).localeCompare(sortKey(b)));
  const played = matches.filter(m=>m.date < today)
    .sort((a,b)=> sortKey(b).localeCompare(sortKey(a)));
  return [...upcoming, ...played];
}

function nextMatchId(){
  const today = todayISO();
  const upcoming = sortedMatches().filter(m=>m.date >= today);
  return upcoming.length ? upcoming[0].id : null;
}

          <div class="player-name">${name}</div>
          <div class="player-controls">
            <div class="control-group">
              <span class="field-label">Komt</span>
              <div class="pillgroup">
                <div class="pill ja ${komtJa}" onclick="setKomt('${match.id}','${name}','ja')">Ja</div>
                <div class="pill nee ${komtNee}" onclick="setKomt('${match.id}','${name}','nee')">Nee</div>
              </div>
            </div>
            ${rijdenHtml}
            ${begeleidenHtml}
          </div>
        </div>`;
    }).join('');

    const fruitChips = PLAYERS.map(name=>{
      const active = r.fruit === name ? 'active' : '';
      return `<div class="fruit-chip ${active}" onclick="setFruit('${match.id}','${name}')">${name}</div>`;
    }).join('');

    let chauffeursHtml = '';
    if(match.location === 'uit'){
      const chauffeurs = r.chauffeurs || [];
      const count = chauffeurs.length;
      const okClass = count >= 3 ? 'ok' : 'warn';
      const chips = PLAYERS.map(name=>{
        const active = chauffeurs.includes(name) ? 'active' : '';
        const pr = r.players[name] || {};
        const suffix = pr.rijden === 'ja' ? ' ✓' : (pr.rijden === 'nee' ? ' ✕' : '');
        return `<div class="fruit-chip driver-chip ${active}" onclick="toggleChauffeur('${match.id}','${name}')">${name}${suffix}</div>`;
      }).join('');
      chauffeursHtml = `
        <div class="subhead">Chauffeurs aanwijzen <span class="driver-count ${okClass}">${count}/3</span></div>
        <p style="font-size:12px;color:var(--grey);margin:0 0 8px;">✓ = heeft aangegeven te kunnen rijden, ✕ = kan niet. Kies minimaal 3 chauffeurs.</p>
        <div class="fruit-chips">${chips}</div>
        ${count < 3 ? '<p style="font-size:12px;color:var(--bordeaux);margin-top:8px;">Nog niet genoeg chauffeurs voor deze uitwedstrijd.</p>' : ''}
      `;
    }

    let begeleidersHtml = '';
    if(match.location === 'thuis'){
      const begeleiders = r.begeleiders || [];
      const count = begeleiders.length;
      const okClass = count >= 2 ? 'ok' : 'warn';
      const chips = PLAYERS.map(name=>{
        const active = begeleiders.includes(name) ? 'active' : '';
        const pr = r.players[name] || {};
        const suffix = pr.begeleiden === 'ja' ? ' ✓' : (pr.begeleiden === 'nee' ? ' ✕' : '');
        return `<div class="fruit-chip driver-chip ${active}" onclick="toggleBegeleider('${match.id}','${name}')">${name}${suffix}</div>`;
      }).join('');
      begeleidersHtml = `
        <div class="subhead">Spelbegeleiders aanwijzen <span class="driver-count ${okClass}">${count}/2</span></div>
        <p style="font-size:12px;color:var(--grey);margin:0 0 8px;">✓ = heeft aangegeven te willen begeleiden, ✕ = kan niet. Kies minimaal 2 spelbegeleiders.</p>
        <div class="fruit-chips">${chips}</div>
        ${count < 2 ? '<p style="font-size:12px;color:var(--bordeaux);margin-top:8px;">Nog niet genoeg spelbegeleiders voor deze thuiswedstrijd.</p>' : ''}
      `;
    }

    // Eén speeldag kan uit meerdere achter-elkaar gespeelde wedstrijden
    // bestaan (match.games) — maar er is maar 1 keer beschikbaarheid, fruit,
    // chauffeurs en spelbegeleiders voor de hele speeldag, vandaar dat al
    // het bovenstaande (rows/fruitChips/chauffeurs/begeleiders) op match.id
    // blijft werken, niet per tegenstander.
    const games = match.games;
    const oppTitle = opponentsTitle(match);
    const titleLine = match.location === 'thuis' ? OWN_TEAM + ' vs ' + oppTitle : oppTitle + ' vs ' + OWN_TEAM;
    const gamesTimeLabel = games.map(gameTimeVeldLabel).join(' & ');
    const locAddr = match.address ? ` · ${match.address}` : '';
    const firstTime = games[0].time;

    let gatherLine;
    if (match.location === 'uit') {
      // De regel "30 minuten voor aanvang op locatie" is vast. Hoe ver van
      // tevoren we bij de Trits verzamelen, hangt af van de rijtijd naar die
      // locatie — bij een wedstrijd verder weg verzamelen we dus eerder dan
      // bij een wedstrijd dichtbij. Is de rijtijd (nog) niet bekend, dan
      // vallen we terug op de oude vaste aanname van 30 minuten rijden.
      // Bij meerdere wedstrijden achter elkaar geldt dit voor de eerste.
      const travel = travelData[match.id];
      const driveMinutes = travel ? travel.minutes : 30;
      const minutesBefore = roundUpToQuarter(30 + driveMinutes);
      if (firstTime) {
        const gatherTime = subtractMinutes(firstTime, minutesBefore);
        const arriveTime = subtractMinutes(firstTime, 30);
        gatherLine = `Verzamelen om <strong>${gatherTime} uur</strong> op de parkeerplaats naast de Trits${travel ? ' (± ' + travel.minutes + ' min rijden)' : ''}. Uiterlijk om <strong>${arriveTime} uur</strong> op locatie aanwezig.`;
      } else {
        gatherLine = `Verzamelen ongeveer ${minutesBefore} minuten voor de wedstrijd op de parkeerplaats naast de Trits, uiterlijk 30 minuten voor aanvang op locatie (exacte tijd volgt zodra de starttijd bekend is).`;
      }
    } else {
      if (firstTime) {
        const arriveTime = subtractMinutes(firstTime, 30);
        gatherLine = `Uiterlijk om <strong>${arriveTime} uur</strong> op locatie aanwezig.`;
      } else {
        gatherLine = 'Uiterlijk 30 minuten voor aanvang op locatie aanwezig (exacte tijd volgt zodra de starttijd bekend is).';
      }
    }

    const afwezigen = PLAYERS.filter(name => (r.players[name] || {}).komt === 'nee');

    const playedGames = games.filter(g => g.ownScore !== '' && g.oppScore !== '');
    const isPlayed = playedGames.length > 0;
    let resultBadgeHtml = '';
    if (games.length === 1 && isPlayed) {
      const os = Number(games[0].ownScore), ps = Number(games[0].oppScore);
      const outcome = os > ps ? 'win' : (os < ps ? 'loss' : 'draw');
      const label = outcome === 'win' ? 'Gewonnen' : (outcome === 'loss' ? 'Verloren' : 'Gelijkspel');
      resultBadgeHtml = `<div class="tag result-${outcome}">${label} ${os}-${ps}</div>`;
    }
    const resultLine = playedGames.map(g => {
      const os = Number(g.ownScore), ps = Number(g.oppScore);
      const outcome = os > ps ? 'win' : (os < ps ? 'loss' : 'draw');
      const label = outcome === 'win' ? 'Gewonnen' : (outcome === 'loss' ? 'Verloren' : 'Gelijkspel');
      return `<div class="announce-row"><strong>${label} ${os}-${ps}</strong>${games.length > 1 ? ' tegen ' + g.opponent : ''}</div>`;
    }).join('');

    const programmaHtml = games.length > 1
      ? `<div class="announce-row">🗓️ Programma: ${games.map(g => g.opponent + ' (' + gameTimeVeldLabel(g) + ')').join(' · ')}</div>`
      : '';
    const veldTagHtml = (games.length === 1 && games[0].veld) ? ` <span class="tag veld">Veld ${games[0].veld}</span>` : '';

    const chauffeurNames = (r.chauffeurs || []);
    const begeleiderNames = (r.begeleiders || []);

    const chauffeursLine = match.location === 'uit'
      ? `<div class="announce-row">🚗 Chauffeurs: ${chauffeurNames.length ? chauffeurNames.join(', ') : 'nog niet aangewezen'}.</div>`
      : '';
    const begeleidersLine = match.location === 'thuis'
      ? `<div class="announce-row">🧑‍🏫 Spelbegeleiders: ${begeleiderNames.length ? begeleiderNames.join(', ') : 'nog niet aangewezen'}.</div>`
      : '';
    const fruitLine = `<div class="announce-row">🍎 Fruit: ${r.fruit ? r.fruit : 'nog niet aangewezen'}.</div>`;

    const wx = weatherData[match.id];
    let weatherLine = '';
    if(wx){
      const stars = '⭐'.repeat(wx.stars) + '☆'.repeat(5 - wx.stars);
      const emoji = wx.precipProb >= 50 ? '🌧️' : (wx.tempC <= 5 ? '🥶' : (wx.tempC >= 22 ? '☀️' : '⛅'));
      weatherLine = `<div class="announce-row">${emoji} Weer: ${Math.round(wx.tempC)}°C, ${wx.precipProb}% kans op regen — ${stars} hockeyweer</div>`;
    }

    const announceHtml = `
      <div class="announce-box">
        <div class="announce-title">📣 Aankondiging — ${titleLine}</div>
        <div class="announce-row"><span class="tag ${match.location}">${match.location === 'thuis' ? 'Thuiswedstrijd' : 'Uitwedstrijd'}</span>${veldTagHtml}</div>
        ${match.address ? '<div class="announce-row">📍 ' + match.address + '</div>' : ''}
        ${programmaHtml}
        ${weatherLine}
        ${resultLine}
        ${afwezigen.length ? '<div class="announce-row warn">⚠️ Afwezig: ' + afwezigen.join(', ') + '.</div>' : ''}
        ${match.witShirt ? '<div class="announce-row">👕 Neem een wit shirt mee in de tas' + (match.location === 'uit' ? ' (verplicht bij kleurconflict op uitwedstrijden)' : '') + '.</div>' : ''}
        <div class="announce-row">🕒 ${gatherLine}</div>
        ${chauffeursLine}
        ${begeleidersLine}
        ${fruitLine}
      </div>`;

    return `
      ${sectionHeader}
      <div class="match-card ${isOpen?'open':''} ${isNext?'next':''}">
        ${isNext ? '<div class="next-flag">Eerstvolgende wedstrijd</div>' : ''}
        <div class="match-top" onclick="toggleMatch('${match.id}')">
          <div class="date-badge"><div class="d">${d}</div><div class="m">${m}</div></div>
          <div class="match-info">
            <div class="opp">${titleLine}</div>
            <div class="meta">${fmtDateLong(match.date)}, ${gamesTimeLabel}${locAddr}</div>
          </div>
          ${(games.length === 1 && isPlayed) ? resultBadgeHtml : '<div class="tag ' + match.location + '">' + (match.location === 'thuis' ? 'Thuis' : 'Uit') + '</div>'}
          <div class="chev">▾</div>
        </div>
        <div class="match-body">
          ${rows}
          <div class="subhead">Wie regelt fruit?</div>
          <div class="fruit-chips">${fruitChips}</div>
          ${chauffeursHtml}
          ${begeleidersHtml}
          ${!whoSel ? '<p style="font-size:12px;color:var(--grey);margin-top:10px;">Tip: kies bovenaan wie je bent, dan zie je straks sneller je eigen naam terug.</p>' : ''}
          ${announceHtml}
        </div>
      </div>`;
  }).join('');

  renderAdmin();
}

function renderAdmin(){

  const panel = document.getElementById('adminPanel');
  readImportFromDom(); // getypte/geplakte tekst bewaren bij herladen van het paneel

  const existing = sortedMatches().map(m=>{
    const witShirtActive = m.witShirt ? 'active' : '';
    const isBeingEdited = m.id === editingMatchId;
    const gamesInfo = m.games.map(g=>{
      const scoreInfo = (g.ownScore !== '' && g.oppScore !== '') ? ` (${g.ownScore}-${g.oppScore})` : '';
      return `vs ${g.opponent}${g.time ? ' ' + g.time + 'u' : ''}${g.veld ? ' veld ' + g.veld : ''}${scoreInfo}`;
    }).join(' & ');
    return `
      <div class="existing-match ${isBeingEdited ? 'editing' : ''}">
        <div class="em-info">${fmtDateLong(m.date)} (${m.location}) — ${gamesInfo}</div>

        <button class="edit-btn" onclick="startEditMatch('${m.id}')">Bewerken</button>
        <button class="del-btn" onclick="deleteMatch('${m.id}')">Verwijder</button>
      </div>`;
  }).join('') || '<p style="font-size:13px;color:var(--grey);">Nog geen wedstrijden.</p>';

  const gameRowsHtml = formGames.map((g,i)=>`
    <div class="game-block">
      <div class="game-block-head">
        <span>Wedstrijd ${i+1}</span>

      <div class="form-row">
        <label>Tegenstander</label>
        <input type="text" id="f-game-opponent-${i}" placeholder="Bijv. Kampong MO8-3" value="${g.opponent}">
      </div>
      <div class="form-row">
        <label>Tijd</label>
        <input type="time" id="f-game-time-${i}" value="${g.time}">
      </div>
      <div class="form-row">
        <label>Veld (van hockeystanden.nl, indien bekend)</label>
        <input type="text" id="f-game-veld-${i}" placeholder="Bijv. 2" value="${g.veld}">
      </div>
      <div class="form-row">
        <label>Uitslag (invullen zodra gespeeld — leeg laten tot dan)</label>
        <div style="display:flex; align-items:center; gap:8px;">
          <input type="number" min="0" id="f-game-ownscore-${i}" placeholder="Baarn" value="${g.ownScore}" style="text-align:center;">
          <span style="color:var(--grey);">–</span>
          <input type="number" min="0" id="f-game-oppscore-${i}" placeholder="Tegenstander" value="${g.oppScore}" style="text-align:center;">
        </div>
      </div>
    </div>
  `).join('');

  panel.innerHTML = importSectionHtml_() + `
    <h3>${editingMatchId ? 'Wedstrijd(en) bewerken' : 'Wedstrijd toevoegen'}</h3>
    <div class="form-row">
      <label>Datum</label>
      <input type="date" id="f-date" value="${formBasic.date}">
    </div>
    <div class="form-row">
      <label>Thuis of uit</label>
      <select id="f-location">
        <option value="thuis" ${formBasic.location==='thuis'?'selected':''}>Thuis</option>
        <option value="uit" ${formBasic.location==='uit'?'selected':''}>Uit</option>
      </select>
    </div>
    <div class="form-row">
      <label>Adres / locatie (optioneel, handig bij uitwedstrijden)</label>
      <input type="text" id="f-address" placeholder="Bijv. Sportpark X, Plaats" value="${formBasic.address}">
    </div>
    <div class="form-row checkbox-row">
      <label><input type="checkbox" id="f-witshirt" ${formBasic.witShirt?'checked':''}> Wit shirt meenemen vermelden</label>
    </div>
    <div class="form-row checkbox-row">
      <label><input type="checkbox" id="f-indoor" ${formBasic.indoor?'checked':''}> Zaalhockey (binnen) — geen weersverwachting tonen</label>

    <p style="font-size:12px;color:var(--grey);margin:14px 2px 6px;">Spelen jullie die dag achter elkaar tegen meerdere tegenstanders (bijv. bij zaalhockey)? Voeg ze hieronder allemaal toe — ouders geven dan maar één keer beschikbaarheid door voor de hele speeldag.</p>
    ${gameRowsHtml}
    <button type="button" class="edit-btn" style="width:100%; margin-bottom:12px;" onclick="addFormGame()">+ Extra tegenstander (zelfde dag)</button>
    <button class="btn-primary" onclick="saveMatchForm()">${editingMatchId ? 'Wijzigingen opslaan' : 'Wedstrijd toevoegen'}</button>
    ${editingMatchId ? '<button class="link-btn" style="width:100%;margin-top:4px;" onclick="cancelEditMatch()">Annuleren</button>' : ''}
    <h3 style="margin-top:20px;">Bestaande wedstrijden</h3>
    <p style="font-size:12px;color:var(--grey);margin:0 0 4px;">"Afwezig" in de aankondiging wordt automatisch bepaald uit wie "Nee" heeft aangegeven bij Komt — daar hoef je hier niets voor te doen.</p>
    ${existing}
  `;
}

// Leest de huidige invoer uit het formulier terug in formBasic/formGames,
// zodat getypte (nog niet opgeslagen) waarden niet verloren gaan wanneer
// een extra tegenstander-rij wordt toegevoegd of verwijderd (wat het
// formulier opnieuw opbouwt).
function readFormFromDom(){
  const dateEl = document.getElementById('f-date');
  if(!dateEl) return;
  formBasic.date = dateEl.value;
  formBasic.location = document.getElementById('f-location').value;
  formBasic.address = document.getElementById('f-address').value;
  formBasic.witShirt = document.getElementById('f-witshirt').checked;
  formBasic.indoor = document.getElementById('f-indoor').checked;
  formGames.forEach((g,i)=>{
    const oppEl = document.getElementById('f-game-opponent-'+i);
    if(!oppEl) return;
    g.time = document.getElementById('f-game-time-'+i).value;
    g.opponent = oppEl.value;
    g.veld = document.getElementById('f-game-veld-'+i).value;
    g.ownScore = document.getElementById('f-game-ownscore-'+i).value;
    g.oppScore = document.getElementById('f-game-oppscore-'+i).value;
  });
}

function addFormGame(){
  readFormFromDom();
  formGames.push(blankGame());
  renderAdmin();
}

function removeFormGame(i){
  readFormFromDom();
  if(formGames.length <= 1) return;
  formGames.splice(i,1);
  renderAdmin();
}

function startEditMatch(id){
  editingMatchId = id;
  const m = matches.find(x=>x.id===id);
  if(m){
    formBasic = { date: m.date, location: m.location, address: m.address, witShirt: m.witShirt, indoor: m.indoor };
    formGames = (m.games && m.games.length ? m.games : [blankGame()]).map(g=>({...g}));
  }
  renderAdmin();
}

function cancelEditMatch(){
  editingMatchId = null;
  resetForm();
  renderAdmin();
}

async function saveMatchForm(){
  const date = document.getElementById('f-date').value;
  const location = document.getElementById('f-location').value;
  const address = document.getElementById('f-address').value.trim();
  const witShirt = document.getElementById('f-witshirt').checked;
  const indoor = document.getElementById('f-indoor').checked;

  const games = formGames.map((_, i)=>({
    time: document.getElementById('f-game-time-'+i).value,
    opponent: document.getElementById('f-game-opponent-'+i).value.trim(),
    veld: document.getElementById('f-game-veld-'+i).value.trim(),
    ownScore: document.getElementById('f-game-ownscore-'+i).value.trim(),
    oppScore: document.getElementById('f-game-oppscore-'+i).value.trim()
  })).filter(g=>g.opponent); // lege rijen (zonder tegenstander) negeren

  if(!date || games.length === 0){
    showToast('Vul minstens datum en één tegenstander in');
    return;
  }
  games.sort((a,b)=>(a.time||'').localeCompare(b.time||''));

  if(editingMatchId){
    const savingId = editingMatchId;
    const m = matches.find(x=>x.id === savingId);
    if(m){
      Object.assign(m, { date, location, address, witShirt, indoor, games });
    }
    editingMatchId = null;
    resetForm();
    try{
      await saveMatch(savingId);
      showToast('Wedstrijd bijgewerkt');
    }catch(e){
      showToast('Opslaan mislukt, probeer opnieuw');
    }
  }else{
    const id = 'm' + Date.now();
    matches.push({ id, date, location, address, witShirt, indoor, games });
    responses[id] = defaultResp();
    resetForm();
    try{
      await saveMatch(id);
      await saveResp(id);
      showToast('Wedstrijd toegevoegd');
    }catch(e){
      showToast('Opslaan mislukt, probeer opnieuw');
    }
  }
  render();
}

async function toggleMatchFlag(matchId, flag){
  const m = matches.find(x=>x.id === matchId);
  if(!m) return;
  m[flag] = !m[flag];
  try{
    await saveMatch(matchId);
  }catch(e){
    showToast('Opslaan mislukt, probeer opnieuw');
  }
  render();
}

async function deleteMatch(id){
  matches = matches.filter(m=>m.id !== id);
  delete responses[id];
  delete weatherData[id];
  delete travelData[id];
  if(editingMatchId === id) editingMatchId = null;
  try{
    await apiDelete('match:'+id);
    await apiDelete('resp:'+id);
    await apiDelete('weather:'+id);
    await apiDelete('travel:'+id);
    showToast('Wedstrijd verwijderd');
  }catch(e){
    showToast('Verwijderen mislukt');
  }
  render();
}
